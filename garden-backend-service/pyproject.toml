[project]
name = "garden-backend-service"
version = "0.1.0"
description = "Source code for the garden backend API"
authors = [
  { name = "Owen Price Skelly", email = "owenpriceskelly@uchicago.edu" },
  { name = "Will Engler", email = "willengler@uchicago.edu" },
  { name = "Hayden Holbrook", email = "hholbrook@uchicago.edu" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
  "pydantic>=2.7.1",
  "fastapi>=0.115.3",
  "uvicorn[standard]>=0.29.0",
  "gunicorn>=23.0.0",
  "globus-sdk>=3.39.0",
  "cachetools>=5.3.3",
  "boto3>=1.34.84",
  "aioboto3>=13.3.0",
  "email-validator>=2.1.1",
  "pydantic-settings>=2.2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",
  "alembic>=1.13.1",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "pydantic-extra-types>=2.9.0",
  "phonenumbers>=8.13.40",
  "structlog>=24.4.0",
  "sqlparse>=0.5.1",
  "modal>=0.73.116,<0.74.0", # NOTE: remember to bump modal dep in sandboxed lambda functions when this changes
  "fastapi-mcp>=0.3.4",
]

[dependency-groups]
dev = []
develop = [
  "pytest>=7.2.0",
  "pytest-mock>=3.10.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.23.7",
  "pre-commit>=3.1.1",
  "jupyter==1.1.1",
  "isort>=5.12.0",
  "mypy>=1.9.0",
  "httpx>=0.27.0",
  "types-cachetools>=5.3.0.7",
  "aiosqlite>=0.20.0",
  "ipython>=8.25.0",
  "testcontainers>=4.5.1",
  "flake8-pytest-style>=2.0.0",
  "pytest-random-order>=1.1.1",
  "ruff>=0.6.9",
  "faker>=37.1.0",
]


[tool.pytest.ini_options]
markers = ["integration"]
addopts = "--random-order"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
