config:
  target: "http://localhost:5500"
  timeout: 10
  phases:
    - duration: 5
      arrivalRate: 5
      name: "Warm up"
    - duration: 15
      arrivalRate: 10
      rampTo: 50
      name: "Ramp up load"
    - duration: 30
      arrivalRate: 30
      name: "Sustained load"

  plugins:
    expect: {}

scenarios:
  - name: "Load Test"
    flow:
      - get:
          url: "/load-test/5"
          expect:
            - statusCode: 200
